packages:
  - "packages/*"

# Shared dependency versions. Reference as "catalog:" in package.json files;
# `pnpm pack` writes the resolved range into the published manifest.
# Keep React / TypeScript / Tailwind aligned with pdf-n-uf.
catalog:
  react: ^19.2.4
  react-dom: ^19.2.4
  "@types/react": ^19.2.14
  "@types/react-dom": ^19.2.3
  "@types/node": ^25.5.0
  typescript: 5.9.3
  tailwindcss: ^4.2.2
  clsx: ^2.1.1
  tailwind-merge: ^3.5.0
  vitest: ^4.1.0
  eslint: ^9.39.2
  vite: ^7.3.0
  playwright: ^1.58.2
  # tests
  happy-dom: ^20.8.4
  "@testing-library/jest-dom": ^6.9.1
  "@testing-library/react": ^16.3.2
  "@vitejs/plugin-react": ^5.1.0

onlyBuiltDependencies:
  - esbuild
